<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Romani Music">
  <defs>
    <linearGradient id="rmStripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3d6e"/>
      <stop offset="55%" stop-color="#1788bf"/>
      <stop offset="100%" stop-color="#8fd0f0"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="10" fill="url(#rmStripe)"/>
  <!-- vertical music stripes -->
  <g opacity="0.35" fill="#071427">
    <rect x="8" y="0" width="5" height="96"/>
    <rect x="20" y="0" width="3" height="96"/>
    <rect x="30" y="0" width="5" height="96"/>
    <rect x="42" y="0" width="3" height="96"/>
    <rect x="52" y="0" width="5" height="96"/>
    <rect x="64" y="0" width="3" height="96"/>
    <rect x="74" y="0" width="5" height="96"/>
    <rect x="86" y="0" width="3" height="96"/>
  </g>
  <!-- staff lines -->
  <g stroke="rgba(255,255,255,0.28)" stroke-width="1.2" fill="none">
    <line x1="10" y1="28" x2="86" y2="28"/>
    <line x1="10" y1="38" x2="86" y2="38"/>
    <line x1="10" y1="48" x2="86" y2="48"/>
    <line x1="10" y1="58" x2="86" y2="58"/>
    <line x1="10" y1="68" x2="86" y2="68"/>
  </g>
  <!-- musical R -->
  <text x="28" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">R</text>
  <!-- musical M -->
  <text x="66" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#e7f6fd" letter-spacing="-1">M</text>
  <!-- small note accent -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="48" cy="22" rx="4.5" ry="3.2" transform="rotate(-18 48 22)"/>
    <rect x="51.5" y="8" width="2" height="16" rx="0.6"/>
  </g>
</svg>
